name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  # Permite redeployar pela aba Actions sem precisar de commit.
  # Necessário porque as variáveis de ambiente vêm dos GitHub Secrets e são
  # reescritas a cada deploy: trocar um secret não tem efeito até que o
  # workflow rode de novo.
  workflow_dispatch:

env:
  PROJECT_ID: marca-e-deixa
  REGION: us-east1
  REPOSITORY: marca-e-deixa-site
  SERVICE: marca-e-deixa-site
  IMAGE: us-east1-docker.pkg.dev/marca-e-deixa/marca-e-deixa-site/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # As variáveis NEXT_PUBLIC_* precisam entrar no BUILD, não só em runtime.
      #
      # O Next.js nomeia os chunks por hash do conteúdo. Sem os build args, o
      # build gera sempre os mesmos placeholders, logo sempre os mesmos nomes de
      # arquivo — e como eles são servidos com `immutable, max-age=31536000`, o
      # CDN continua entregando a versão antiga por um ano, mesmo após o
      # entrypoint reescrever o conteúdo no container.
      #
      # Passando os valores aqui, cada mudança altera o hash, os nomes mudam e o
      # cache invalida sozinho. O sed do entrypoint vira rede de segurança.
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}" \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Write env vars file
        run: |
          cat > env-vars.yaml <<EOF
          NEXT_PUBLIC_APP_URL: "${{ secrets.NEXT_PUBLIC_APP_URL }}"
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}"
          STRIPE_MODE: "${{ secrets.STRIPE_MODE }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}"
          STRIPE_WEBHOOK_SECRET: "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          RECAPTCHA_SECRET_KEY: "${{ secrets.RECAPTCHA_SECRET_KEY }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --env-vars-file=env-vars.yaml
          rm -f env-vars.yaml
